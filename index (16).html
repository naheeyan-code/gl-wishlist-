            {pageView === 'form' && (
              <motion.div key="form" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                <WishlistWizard key={wizardKey} internal initialData={wizardInitial} onComplete={handleWizardComplete} />
              </motion.div>
            )}
            {pageView === 'admin' && adminData && (
              <motion.div key="admin" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                <AdminView submission={adminData} onUpdate={handleUpdateWishlist} />
              </motion.div>
            )}
          </AnimatePresence>
        </AppShell>
      );
    }



    // ============================================================
    // PUBLIC (CUSTOMER) SURFACE — same 7-step wizard, no auth.
    // Reached at  ?form  / ?client  (or #form / #client / #wishlist).
    // Lets one deployed file serve both admin and the customer form.
    // ============================================================
    function PublicThankYou({ data }) {
      return (
        <div className="max-w-xl mx-auto px-6 py-16 text-center">
          <div className="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center mx-auto mb-6"><CheckCircle2 className="w-9 h-9 text-emerald-600" /></div>
          <h1 className="text-2xl font-bold text-stone-900 mb-2" style={{ fontFamily: 'Fraunces, serif' }}>Thank you, {data.contactName || 'team'}!</h1>
          <p className="text-stone-500 mb-8">We've received your wishlist for <strong className="text-stone-700">{data.companyName}</strong>. Our team will build your 30/60/90 success plan and come back with scope and capability fit.</p>
          <div className="bg-white rounded-2xl border border-stone-200 p-6 text-left">
            <p className="text-xs font-bold uppercase tracking-wider text-stone-400 mb-3">What happens next</p>
            <ol className="space-y-2.5 text-sm text-stone-600">
              <li className="flex gap-2.5"><span className="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold flex items-center justify-center flex-shrink-0">1</span> We review your goals and map each project to the right capability.</li>
              <li className="flex gap-2.5"><span className="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold flex items-center justify-center flex-shrink-0">2</span> We finalize the 30/60/90 plan and how we'll measure the outcomes you defined.</li>
              <li className="flex gap-2.5"><span className="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold flex items-center justify-center flex-shrink-0">3</span> We align and get to work.</li>
            </ol>
          </div>
        </div>
      );
    }

    const CLIENT_PAGE_PASSWORD = 'GLwishlist@Submit';
    const SUPER_ADMIN_EMAIL = 'maintainer@gmail.com'; // sole maintainer — set to YOUR private email (a Gmail is fine)
    const emailAllowed = (e) => { const x = (e || '').trim().toLowerCase(); return x === SUPER_ADMIN_EMAIL.toLowerCase() || x.endsWith('@getlevrg.com'); };

    function ClientGate({ onUnlock }) {
      const [pw, setPw] = React.useState('');
      const [err, setErr] = React.useState(false);
      const submit = () => {
        if (pw.trim() === CLIENT_PAGE_PASSWORD) { setErr(false); onUnlock(); }
        else setErr(true);
      };
      const LockIcon = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <rect x="4" y="11" width="16" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
      );
      const VMark = ({ className }) => (
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M9 16 L21 34 L39 9" />
        </svg>
      );
      return (
        <div className="relative overflow-hidden flex items-center justify-center px-4 py-16"
          style={{ minHeight: '90vh', background: 'linear-gradient(160deg,#ecfdf5 0%,#f0fdfa 45%,#f8fafc 100%)' }}>
          {/* soft brand glows */}
          <div aria-hidden className="pointer-events-none absolute -top-28 -left-24 w-96 h-96 rounded-full bg-emerald-300/30 blur-3xl" />
          <div aria-hidden className="pointer-events-none absolute -bottom-32 -right-24 w-[30rem] h-[30rem] rounded-full bg-teal-300/30 blur-3xl" />
          {/* subtle dot grid */}
          <div aria-hidden className="pointer-events-none absolute inset-0"
            style={{ backgroundImage: 'radial-gradient(rgba(15,118,110,0.08) 1px, transparent 1px)', backgroundSize: '24px 24px' }} />
          {/* brand V watermark */}
          <div aria-hidden className="pointer-events-none absolute inset-0 flex items-center justify-center" style={{ color: 'rgba(5,150,105,0.07)' }}>
            <VMark className="w-[540px] h-[540px] max-w-[88%]" />
          </div>

          <motion.div
            initial={{ opacity: 0, y: 18, scale: 0.98 }}
            animate={{ opacity: 1, y: 0, scale: 1 }}
            transition={{ duration: 0.45, ease: 'easeOut' }}
            className="relative w-full max-w-md">
            <div className="bg-white/90 backdrop-blur-xl rounded-3xl border border-white/70 p-8 sm:p-10 text-center"
              style={{ boxShadow: '0 24px 70px -24px rgba(16,185,129,0.35)' }}>
              <img src={LOGO_URI} alt="Get Levrg" className="h-8 w-auto mx-auto mb-8" />

              <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center mx-auto mb-5"
                style={{ boxShadow: '0 10px 24px -6px rgba(13,148,136,0.5)' }}>
                <VMark className="w-7 h-7 text-white" />
              </div>

              <h1 className="text-2xl text-stone-900 mb-2" style={{ fontFamily: 'Fraunces, serif' }}>Customer Wishlist</h1>
              <p className="text-sm text-stone-500 mb-7 max-w-xs mx-auto">Enter the access phrase to continue</p>

              <motion.div variants={{ idle: { x: 0 }, shake: { x: [0, -9, 8, -6, 5, 0] } }} animate={err ? 'shake' : 'idle'} transition={{ duration: 0.4 }}>
                <div className="relative">
                  <LockIcon className="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                  <input
                    type="password"
                    value={pw}
                    autoFocus
                    onChange={(e) => { setPw(e.target.value); setErr(false); }}
                    onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
                    placeholder="Access phrase"
                    className={`w-full pl-10 pr-3 py-3 rounded-xl text-sm text-stone-900 placeholder-stone-300 bg-white border transition-all focus:outline-none focus:ring-2 ${err ? 'border-red-400 focus:ring-red-500/10' : 'border-stone-200 focus:border-emerald-500 focus:ring-emerald-500/10'}`}
                  />
                </div>
              </motion.div>

              {err && <p className="text-xs text-red-600 mt-2.5">Incorrect phrase. Please try again.</p>}

              <button onClick={submit}
                className="mt-5 w-full py-3 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 transition-all flex items-center justify-center gap-2 group"
                style={{ boxShadow: '0 10px 24px -8px rgba(13,148,136,0.6)' }}>
                Continue
                <ArrowRight className="w-4 h-4 group-hover:translate-x-0.5 transition-transform" />
              </button>

              <div className="mt-7 flex items-center justify-center gap-2 text-[11px] text-stone-400">
                <span className="h-px w-6 bg-stone-200" />
                An intake form from your Get Levrg team
                <span className="h-px w-6 bg-stone-200" />
              </div>
            </div>
          </motion.div>
        </div>
      );
    }

    function PublicForm() {
      const [unlocked, setUnlocked] = React.useState(() => {
        try { return sessionStorage.getItem('gl_client_gate') === 'ok'; } catch (e) { return false; }
      });
      const [submitted, setSubmitted] = React.useState(false);
      const [done, setDone] = React.useState(null);
      const handleComplete = async (data) => {
        const { error } = await supabase.from('wishlists').insert([toRow(data)]);
        if (error) throw error;
        setDone(data); setSubmitted(true); window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      if (!unlocked) {
        return <ClientGate onUnlock={() => { try { sessionStorage.setItem('gl_client_gate', 'ok'); } catch (e) {} setUnlocked(true); }} />;
      }
      return (
        <div className="bg-stone-50">
          <div className="lg:hidden sticky top-0 z-50 bg-white/85 backdrop-blur-lg border-b border-stone-200">
            <div className="max-w-6xl mx-auto px-6 py-3 flex items-center">
              <img src={LOGO_URI} alt="Get Levrg" className="h-7 w-auto" />
            </div>
          </div>
          {submitted ? <PublicThankYou data={done} /> : <WishlistWizard onComplete={handleComplete} />}
        </div>
      );
    }

    function SharedWishlist({ token }) {
      const [phase, setPhase] = React.useState('checking'); // checking | needlogin | loading | ok | notfound
      const [w, setW] = React.useState(null);
      const [editing, setEditing] = React.useState(false);
      const [role, setRole] = React.useState(null);
      const [me, setMe] = React.useState(null);

      const fetchIt = React.useCallback(async () => {
        setPhase('loading');
        try {
          const { data, error } = await supabase.from('wishlists').select('*').eq('share_token', token).is('deleted_at', null).maybeSingle();
          if (error || !data) { setPhase('notfound'); return; }
          setW(data); setPhase('ok');
        } catch (e) { setPhase('notfound'); }
      }, [token]);

      const init = React.useCallback(async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          setMe(session.user);
          try {
            const { data: prof } = await supabase.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
            setRole(prof ? prof.role : null);
          } catch (e) { /* ignore */ }
        }
        fetchIt();
      }, [fetchIt]);

      React.useEffect(() => {
        let alive = true;
        supabase.auth.getSession().then(({ data: { session } }) => {
          if (!alive) return;
          if (session) init(); else setPhase('needlogin');
        });
        return () => { alive = false; };
      }, [init]);

      const rowToSub = (r) => ({
        id: r.id,
        companyName: r.company_name, companyUrl: r.company_url || '',
        contactName: r.contact_name || '', email: r.contact_email || '',
        primaryStakeholder: r.primary_stakeholder || '', department: r.department || '',
        businessStage: r.business_stage || '', timezone: r.timezone || '',
        goals: Array.isArray(r.goals) ? r.goals : [], priorityOther: r.priority_other || '',
        primaryGoal: r.primary_goal || '', goalReason: r.goal_reason || '',
        successDefinition: r.success_definition || '', successMetrics: Array.isArray(r.success_metrics) ? r.success_metrics : [],
        metricOther: r.metric_other || '', successNotes: r.success_notes || '',
        baseline: Array.isArray(r.success_baseline) ? r.success_baseline : [],
        projects: Array.isArray(r.projects) ? r.projects : []
      });
      const saveEdit = async (data) => {
        const upd = toRow(data);
        delete upd.submitted_at;
        const { error } = await supabase.from('wishlists').update(upd).eq('id', w.id);
        if (error) throw error;
        setEditing(false);
        fetchIt();
      };

      if (phase === 'checking' || phase === 'loading') {
        return (
          <div className="bg-stone-50 flex items-center justify-center" style={{ minHeight: '90vh' }}>
            <div className="w-8 h-8 border-3 border-stone-200 border-t-emerald-600 rounded-full animate-spin" />
          </div>
        );
      }
      if (phase === 'needlogin') {
        return <LoginView onLogin={() => init()} />;
      }
      if (phase === 'notfound') {
        return (
          <div className="bg-stone-50 flex items-center justify-center px-4" style={{ minHeight: '90vh' }}>
            <div className="w-full max-w-sm bg-white rounded-2xl border border-stone-200 shadow-sm p-8 text-center">
              <img src={LOGO_URI} alt="Get Levrg" className="h-8 w-auto mx-auto mb-6" />
              <h1 className="text-lg font-bold text-stone-900 mb-1">Wishlist not found</h1>
              <p className="text-sm text-stone-500">This link may be invalid or has been revoked, or your account may not have access.</p>
            </div>
          </div>
        );
      }

      const goals = Array.isArray(w.goals) ? w.goals : [];
      const metrics = Array.isArray(w.success_metrics) ? w.success_metrics : [];
      const baseline = Array.isArray(w.success_baseline) ? w.success_baseline.filter(b => b && (b.current || b.target)) : [];
      const projects = Array.isArray(w.projects) ? w.projects.filter(p => p && p.name) : [];
      const Row = ({ k, v }) => (v ? <div className="flex gap-3 py-1.5 text-sm border-b border-stone-50 last:border-0"><span className="text-stone-400 w-40 flex-shrink-0">{k}</span><span className="text-stone-800">{v}</span></div> : null);
      const Card = ({ title, children }) => (
        <div className="bg-white rounded-2xl border border-stone-200 shadow-sm p-6 mb-5">
          <h2 className="text-xs font-bold uppercase tracking-wider text-emerald-700 mb-3">{title}</h2>
          {children}
        </div>
      );

      if (editing) {
        return (
          <div className="bg-stone-50" style={{ minHeight: '100vh' }}>
            <div className="sticky top-0 z-20 bg-white/85 backdrop-blur-lg border-b border-stone-200">
              <div className="max-w-3xl mx-auto px-6 py-3 flex items-center justify-between">
                <img src={LOGO_URI} alt="Get Levrg" className="h-7 w-auto" />
                <button onClick={() => setEditing(false)} className="inline-flex items-center gap-1 text-xs font-semibold text-stone-500 hover:text-stone-800 transition-colors"><ArrowLeft className="w-3.5 h-3.5" /> Back to read-only</button>
              </div>
            </div>
            <WishlistWizard internal initialData={submissionToWizard(rowToSub(w))} onComplete={saveEdit} />
          </div>
        );
      }

      const goToDashboard = () => { window.location.href = window.location.origin + window.location.pathname; };
      const doLogout = async () => { try { await supabase.auth.signOut(); } catch (e) {} window.location.href = window.location.origin + window.location.pathname; };

      return (
        <AppShell user={me || { email: '' }} userRole={role}
          onLogout={doLogout}
          onNewWishlist={goToDashboard} onAllWishlists={goToDashboard}
          onUserMgmt={goToDashboard} onProfile={goToDashboard} onInviteClient={goToDashboard} onSuperAdmin={goToDashboard}
          sidebarContent={
            <>
              <button onClick={goToDashboard} className="inline-flex items-center gap-1.5 text-xs font-semibold text-stone-600 hover:text-stone-900 border border-stone-200 hover:border-stone-900 px-3 py-1.5 rounded-lg transition-colors">
                <ArrowLeft className="w-3.5 h-3.5" /> Dashboard
              </button>
              <span className="text-[11px] font-semibold text-stone-500 bg-stone-100 px-2.5 py-1 rounded-full">Read-only</span>
              {(role === 'admin' || role === 'sales_am') && (
                <button onClick={() => setEditing(true)} className="inline-flex items-center gap-1.5 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-lg transition-colors">
                  <Edit3 className="w-3.5 h-3.5" /> Edit Wishlist
                </button>
              )}
            </>
          }>

          <div className="max-w-3xl mx-auto px-6 py-10">
            <div className="mb-8">
              <h1 className="text-3xl text-stone-900 leading-tight" style={{ fontFamily: 'Fraunces, serif' }}>
                Customer Wishlist — <em className="italic font-semibold text-emerald-600">{w.company_name || 'Company'}</em>
              </h1>
              {w.submitted_at && <p className="text-sm text-stone-400 mt-1">Submitted {new Date(w.submitted_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</p>}
            </div>

            <Card title="Customer details">
              <Row k="Company" v={w.company_name} />
              <Row k="Website" v={w.company_url} />
              <Row k="Contact" v={w.contact_name} />
              <Row k="Primary stakeholder" v={w.primary_stakeholder} />
              <Row k="Department" v={w.department} />
              <Row k="Business stage" v={w.business_stage} />
              <Row k="Timezone" v={w.timezone} />
            </Card>

            <Card title="Goals & success">
              {goals.length > 0 && (
                <div className="mb-4">
                  <p className="text-[11px] uppercase tracking-wider font-semibold text-stone-400 mb-1.5">Top goals</p>
                  <div className="flex flex-wrap gap-1.5">
                    {goals.map(g => (
                      <span key={g} className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${g === w.primary_goal ? 'border-emerald-600 bg-emerald-50 text-emerald-800' : 'border-stone-200 bg-stone-50 text-stone-600'}`}>
                        {g === w.primary_goal ? '★ ' : ''}{g}
                      </span>
                    ))}
                  </div>
                </div>
              )}
              <Row k="Why it matters now" v={w.goal_reason} />
              <Row k="Definition of success" v={w.success_definition} />
              <Row k="Metrics that matter" v={metrics.join(', ')} />
              <Row k="Additional notes" v={w.success_notes} />
            </Card>

            {baseline.length > 0 && (
              <Card title="Baseline → target (90 days)">
                <table className="w-full text-sm">
                  <thead className="text-[11px] uppercase tracking-wider text-stone-400">
                    <tr><th className="text-left font-semibold py-1.5">Metric</th><th className="text-left font-semibold py-1.5">Today</th><th className="text-left font-semibold py-1.5 text-emerald-700">Target</th></tr>
                  </thead>
                  <tbody className="divide-y divide-stone-50">
                    {baseline.map(b => (
                      <tr key={b.label}>
                        <td className="py-1.5 text-stone-600">{b.label}</td>
                        <td className="py-1.5 text-stone-800">{b.current || '—'}</td>
                        <td className="py-1.5 text-emerald-700 font-medium">{b.target || '—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </Card>
            )}

            <Card title={`Wishlist projects (${projects.length})`}>
              {projects.length === 0 ? <p className="text-sm text-stone-400">No projects listed.</p> : (
                <div className="space-y-4">
                  {projects.map((p, i) => (
                    <div key={i} className="border border-stone-100 rounded-xl p-4">
                      <div className="flex items-center justify-between mb-1.5">
                        <p className="font-semibold text-stone-900 text-sm">{p.name}</p>
                        {p.priority && <span className="text-[11px] font-semibold text-stone-500 bg-stone-100 px-2 py-0.5 rounded">{p.priority}</span>}
                      </div>
                      {p.description && <p className="text-sm text-stone-600 mb-1">{p.description}</p>}
                      {p.desiredOutcome && <p className="text-sm text-stone-500"><span className="text-stone-400">Desired outcome:</span> {p.desiredOutcome}</p>}
                      {(p.targetStart || p.targetCompletion) && <p className="text-xs text-stone-400 mt-1.5">{[p.targetStart, p.targetCompletion].filter(Boolean).join(' → ')}</p>}
                      {p.notes && <p className="text-xs text-stone-400 mt-1">{p.notes}</p>}
                    </div>
                  ))}
                </div>
              )}
            </Card>

            <p className="text-center text-[11px] text-stone-400 mt-8">This is a read-only view shared by your Get Levrg team.</p>
          </div>
        </AppShell>
      );
    }

    function Root() {
      const q = window.location.search || '';
      const params = new URLSearchParams(q);
      const shareToken = params.get('w');
      if (shareToken) return <SharedWishlist token={shareToken} />;
      const h = (window.location.hash || '').replace('#', '');
      const isPublic = /[?&](client|form)(=|&|$)/.test(q) || /^(client|form|wishlist)$/.test(h);
      return isPublic ? <PublicForm /> : <App />;
    }


    // Mount app, hide boot loader
    const root = createRoot(document.getElementById('root'));
    root.render(<Root />);
    setTimeout(() => {
      const loader = document.getElementById('boot-loader');
      if (loader) loader.classList.add('hidden');
      setTimeout(() => loader && loader.remove(), 400);
    }, 100);
  </script>
  <script>
    // Report height to parent when embedded as the customer form (?form).
    (function () {
      function reportHeight() {
        if (window.parent !== window) window.parent.postMessage({ type: 'gl-wishlist-height', height: document.body.scrollHeight }, '*');
      }
      try { new ResizeObserver(reportHeight).observe(document.body); } catch (e) {}
      window.addEventListener('load', reportHeight);
      setInterval(reportHeight, 1000);
    })();
  </script>
</body>
</html>
