    function LoginView({ onLogin }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [mode, setMode] = useState('login'); // login | forgot | forgot_sent
      const [resetMsg, setResetMsg] = useState('');

      const handleLogin = async () => {
        setError('');
        if (!emailAllowed(email)) {
          setError('Only @getlevrg.com accounts are allowed.');
          return;
        }
        setLoading(true);
        const { data, error: authError } = await supabase.auth.signInWithPassword({ email, password });
        setLoading(false);
        if (authError) { setError(authError.message); return; }
        onLogin(data.user);
      };

      const handleForgot = async () => {
        setError('');
        if (!emailAllowed(email)) {
          setError('Only @getlevrg.com accounts are allowed.');
          return;
        }
        setLoading(true);
        const { error: resetError } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/?reset=true'
        });
        setLoading(false);
        if (resetError) { setError(resetError.message); return; }
        setMode('forgot_sent');
      };

      const handleMagic = async () => {
        setError('');
        if (!emailAllowed(email)) { setError('Only @getlevrg.com accounts are allowed.'); return; }
        setLoading(true);
        const { error: otpErr } = await supabase.auth.signInWithOtp({
          email, options: { emailRedirectTo: window.location.origin + window.location.pathname }
        });
        setLoading(false);
        if (otpErr) { setError(otpErr.message); return; }
        setMode('magic_sent');

    function ResetPasswordView({ onDone }) {
      const [password, setPassword] = useState('');

      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [done, setDone] = useState(false);

      const handleReset = async () => {
        setError('');
        if (password.length < 8) { setError('Password must be at least 8 characters.'); return; }
        if (password !== confirm) { setError('Passwords do not match.'); return; }
        setLoading(true);
        const { error: updateError } = await supabase.auth.updateUser({ password });
        setLoading(false);
        if (updateError) { setError(updateError.message); return; }
        setDone(true);
        setTimeout(() => onDone(), 2000);
      };

      return (
        <div className="min-h-screen bg-stone-50 flex flex-col items-center justify-center px-4">
          <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.4 }}

            <div className="bg-white rounded-2xl border border-stone-200 shadow-sm p-8">

                    </div>
                    <button onClick={handleReset} disabled={loading || !password || !confirm}
                      className="w-full py-2.5 bg-stone-900 hover:bg-stone-700 text-white rounded-lg font-semibold text-sm transition-colors disabled:opacity-60 flex items-center justify-center gap-2">
                      {loading ? <><div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" /> Updating…</> : 'Update password'}

    function WishlistsView({ user, userRole, onSelectWishlist, onNewWishlist, onLogout, onUserMgmt, onInviteClient, onSuperAdmin, onProfile }) {
      const [wishlists, setWishlists] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState('');
      const [copiedId, setCopiedId] = React.useState(null);
      const [view, setView] = React.useState('active'); // active | deleted
      const [confirmDelete, setConfirmDelete] = React.useState(null); // { w, mode: 'soft' | 'permanent' }
      const [inviteOpen, setInviteOpen] = React.useState(false);
      const [inviteCompany, setInviteCompany] = React.useState('');
      const [inviteEmail, setInviteEmail] = React.useState('');
      const [inviteMsg, setInviteMsg] = React.useState('');
      const [inviteSending, setInviteSending] = React.useState(false);
      const sendInvite = async () => {
        const email = inviteEmail.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setInviteMsg('Enter a valid email address.'); return; }
        setInviteSending(true); setInviteMsg('');
        try {
          const { error } = await supabase.from('client_invites').insert([{ company: inviteCompany.trim() || null, client_email: email, access_phrase: CLIENT_PAGE_PASSWORD, invited_by: user.id }]);
          if (error) throw error;
          setInviteMsg(`\u2713 Invite sent to ${email}`);
          setInviteCompany(''); setInviteEmail('');
        } catch (e) {
          setInviteMsg(e.message || 'Could not send the invite.');
        }
        setInviteSending(false);
      };
      const copyWishlistLink = async (w) => {
        if (!w.share_token) return;
        const url = `${window.location.origin}${window.location.pathname}?w=${w.share_token}`;
        try { await navigator.clipboard.writeText(url); } catch (e) { window.prompt('Copy this link:', url); }
        setCopiedId(w.id); setTimeout(() => setCopiedId(null), 2000);
      };

      React.useEffect(() => { fetchWishlists(); }, [view]);

      const fetchWishlists = async () => {
        setLoading(true);
        let q = supabase
          .from('wishlists')
          .select('id, created_at, company_name, company_url, contact_name, contact_email, primary_stakeholder, department, business_stage, timezone, goals, priority_other, primary_goal, goal_reason, success_definition, success_metrics, metric_other, success_notes, success_baseline, share_token, deleted_at, submitted_at, projects')
          .order('created_at', { ascending: false });
        q = view === 'deleted' ? q.not('deleted_at', 'is', null) : q.is('deleted_at', null);
        const { data, error } = await q;
        setLoading(false);
        if (error) { setError(error.message); return; }
        setWishlists(data || []);
      };

      const doSoftDelete = async (w) => {
        await supabase.from('wishlists').update({ deleted_at: new Date().toISOString() }).eq('id', w.id);
        setWishlists(prev => prev.filter(x => x.id !== w.id));
        setConfirmDelete(null);
      };
      const doRestore = async (w) => {
        await supabase.from('wishlists').update({ deleted_at: null }).eq('id', w.id);
        setWishlists(prev => prev.filter(x => x.id !== w.id));
      };
      const doPermanentDelete = async (w) => {
        await supabase.from('wishlists').delete().eq('id', w.id);
        setWishlists(prev => prev.filter(x => x.id !== w.id));
        setConfirmDelete(null);
      };

      return (
        <AppShell user={user} userRole={userRole} onLogout={onLogout} onNewWishlist={onNewWishlist} onAllWishlists={() => {}} onUserMgmt={onUserMgmt} onInviteClient={onInviteClient} onSuperAdmin={onSuperAdmin} onProfile={onProfile}>
          <div className="max-w-5xl mx-auto px-6 py-10">
            <div className="mb-8 flex items-center justify-between gap-4 flex-wrap">
              <div>
                <h1 className="text-2xl font-bold text-stone-900 mb-1">{view === 'deleted' ? 'Deleted Wishlists' : 'All Wishlists'}</h1>
                <p className="text-sm text-stone-500">{wishlists.length} {view === 'deleted' ? (wishlists.length === 1 ? 'deleted item' : 'deleted items') : (wishlists.length === 1 ? 'submission' : 'submissions')}</p>
              </div>
              <div className="flex items-center gap-2">

    function ProfileView({ user, userRole, profile, onBack, onSaved }) {
      const [fullName, setFullName] = React.useState(profile?.full_name || '');
      const [saving, setSaving] = React.useState(false);
      const [saved, setSaved] = React.useState(false);

      const roleLabel = { admin: 'Admin', sales_am: 'Sales / AM', project_manager: 'Project Manager', csm: 'CSM' };

      const handleSave = async () => {
        setSaving(true);
        await supabase.from('profiles').update({ full_name: fullName }).eq('id', user.id);
        setSaving(false);
        setSaved(true);
        setTimeout(() => setSaved(false), 2000);
        if (onSaved) onSaved(fullName);
      };

      return (
        <AppShell user={user} userRole={userRole} onLogout={async () => { await supabase.auth.signOut(); }}
          onNewWishlist={onBack} onAllWishlists={onBack} onUserMgmt={onBack} onProfile={() => {}} onInviteClient={onBack} onSuperAdmin={onBack}>

    // ============================================================
    // USER MANAGEMENT (admin only)
    // ============================================================
    function UserMgmtView({ user, userRole, onBack, onLogout, isSuper }) {
      const [profiles, setProfiles] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [inviteEmail, setInviteEmail] = React.useState('');
      const [inviteRole, setInviteRole] = React.useState('sales_am');
      const [inviting, setInviting] = React.useState(false);
      const [inviteMsg, setInviteMsg] = React.useState('');
      const [pending, setPending] = React.useState([]);

      React.useEffect(() => { fetchProfiles(); }, []);

      const fetchProfiles = async () => {
        setLoading(true);
        const [{ data: profs }, { data: pend }] = await Promise.all([
          supabase.from('profiles').select('*').order('created_at', { ascending: false }),
          supabase.from('pending_invites').select('*').order('created_at', { ascending: false })
        ]);
        setLoading(false);
        setProfiles(profs || []);
        setPending(pend || []);
      };

      const handleInvite = async () => {
        const email = inviteEmail.trim().toLowerCase();
        if (!email.endsWith('@getlevrg.com')) {
          setInviteMsg('Only @getlevrg.com emails allowed.'); return;
        }
        setInviting(true);
        setInviteMsg('');
        try {
          // 1) Pre-authorize this email's role (admin-only via RLS). The signup
          //    trigger reads this to set their role — the client never sets role.
          const { error: pErr } = await supabase.from('pending_invites')
            .upsert({ email, role: inviteRole, invited_by: user.id }, { onConflict: 'email' });
          if (pErr) throw pErr;
          // 2) Email a one-click login link. The account is created on first click
          //    and the trigger applies the role above. No service key needed.
          const { error: oErr } = await supabase.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: window.location.origin + window.location.pathname }
          });
          if (oErr) throw oErr;
          setInviteMsg(`✓ Login link sent to ${email}`);
          setInviteEmail('');
          fetchProfiles();
        } catch (err) {
          setInviteMsg(err.message || 'Could not send invite.');
        }
        setInviting(false);
        setTimeout(() => setInviteMsg(''), 6000);
      };

      const cancelInvite = async (email) => {
        await supabase.from('pending_invites').delete().eq('email', email);
        setPending(prev => prev.filter(p => p.email !== email));
      };

      const handleRoleChange = async (profileId, newRole) => {
        await supabase.from('profiles').update({ role: newRole }).eq('id', profileId);
        setProfiles(prev => prev.map(p => p.id === profileId ? { ...p, role: newRole } : p));
      };

      const handleDelete = async (profileId) => {
        if (!confirm('Remove this user? They will lose access immediately.')) return;
        await supabase.from('profiles').delete().eq('id', profileId);
        setProfiles(prev => prev.filter(p => p.id !== profileId));
      };

      const roleLabel = { admin: 'Admin', sales_am: 'Sales / AM', project_manager: 'Project Manager', csm: 'CSM' };
      const roleOptions = ['admin', 'sales_am', 'project_manager', 'csm'];

      return (
        <AppShell user={user} userRole={userRole} onLogout={onLogout}
          onNewWishlist={onBack} onAllWishlists={onBack} onUserMgmt={() => {}} onProfile={onBack} onInviteClient={onBack} onSuperAdmin={onBack}>
          <div className="max-w-3xl mx-auto px-6 py-10">
            <button onClick={onBack} className="text-sm text-stone-500 hover:text-stone-900 mb-6 flex items-center gap-1">← Back</button>
            <h1 className="text-2xl font-bold text-stone-900 mb-2">{isSuper ? 'Super Admin' : 'User Management'}</h1>
            <p className="text-sm text-stone-500 mb-8">Manage team access and roles</p>

            {/* Invite user */}
            <div className="bg-white rounded-2xl border border-stone-200 p-6 mb-6">
              <h2 className="text-sm font-bold text-stone-900 mb-1">Invite Team Member</h2>
              <p className="text-xs text-stone-500 mb-4">They'll get a one-click login link by email — no password needed. Their role is applied automatically on first sign-in.</p>
              <div className="flex gap-3 flex-wrap">
                <input value={inviteEmail} onChange={e => setInviteEmail(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleInvite()}
                  placeholder="name@getlevrg.com"
                  className="flex-1 min-w-48 px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-500" />
                <select value={inviteRole} onChange={e => setInviteRole(e.target.value)}
                  className="px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-stone-500 bg-white">
                  {roleOptions.map(r => <option key={r} value={r}>{roleLabel[r]}</option>)}
                </select>
                <button onClick={handleInvite} disabled={inviting || !inviteEmail}
                  className="px-4 py-2 bg-stone-900 hover:bg-stone-700 text-white rounded-lg text-sm font-semibold transition-colors disabled:opacity-50 flex items-center gap-2">
                  {inviting ? <><div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> Sending…</> : 'Send Invite'}
                </button>
              </div>
              {inviteMsg && (
                <p className={`mt-3 text-xs font-medium ${inviteMsg.startsWith('✓') ? 'text-emerald-600' : 'text-red-600'}`}>
                  {inviteMsg}
                </p>
              )}
            </div>

            {/* Users table */}
            <div className="bg-white rounded-2xl border border-stone-200 overflow-hidden">
              <div className="px-5 py-4 border-b border-stone-100">
                <h2 className="text-sm font-bold text-stone-900">Team Members ({profiles.length})</h2>
              </div>
              {loading ? (
                <div className="py-10 flex justify-center text-stone-400 text-sm">Loading…</div>
              ) : (
                <table className="w-full">
                  <thead>
                    <tr className="bg-stone-50 border-b border-stone-100">
                      <th className="px-5 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-stone-500">Member</th>
                      <th className="px-5 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-stone-500">Role</th>
                      <th className="px-5 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-stone-500">Joined</th>
                      <th className="px-5 py-3 w-10"></th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-stone-100">
                    {(isSuper ? profiles : profiles.filter(p => (p.email || '').toLowerCase() !== SUPER_ADMIN_EMAIL)).map(p => (
                      <tr key={p.id} className="hover:bg-stone-50 transition-colors">
                        <td className="px-5 py-3.5">
                          <p className="text-sm font-medium text-stone-900">{p.full_name || '—'}</p>
                          <p className="text-xs text-stone-400">{p.email}</p>
                        </td>
                        <td className="px-5 py-3.5">
                          {p.id === user.id ? (
                            <span className="text-xs font-semibold text-stone-600 bg-stone-100 px-2 py-1 rounded">{roleLabel[p.role]}</span>
                          ) : (
                            <select value={p.role} onChange={e => handleRoleChange(p.id, e.target.value)}
                              className="text-xs px-2 py-1.5 border border-stone-200 rounded-lg bg-white focus:outline-none focus:border-stone-500">
                              {roleOptions.map(r => <option key={r} value={r}>{roleLabel[r]}</option>)}
                            </select>
                          )}
                        </td>
                        <td className="px-5 py-3.5 text-xs text-stone-400">
                          {new Date(p.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                        </td>
                        <td className="px-3 py-3.5">
                          {p.id !== user.id && (
                            <button onClick={() => handleDelete(p.id)}
                              className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-red-50 text-stone-300 hover:text-red-500 transition-colors">
                              <Trash2 className="w-4 h-4" />
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>

            {/* Pending invites */}
            {pending.length > 0 && (
              <div className="bg-white rounded-2xl border border-stone-200 overflow-hidden mt-6">
                <div className="px-5 py-4 border-b border-stone-100">
                  <h2 className="text-sm font-bold text-stone-900">Pending Invites ({pending.length})</h2>
                  <p className="text-xs text-stone-400 mt-0.5">Sent a login link — they'll appear under Team Members once they sign in.</p>
                </div>
                <table className="w-full">
                  <tbody className="divide-y divide-stone-100">
                    {pending.map(p => (
                      <tr key={p.email} className="hover:bg-stone-50 transition-colors">
                        <td className="px-5 py-3.5 text-sm text-stone-700">{p.email}</td>
                        <td className="px-5 py-3.5"><span className="text-xs font-semibold text-amber-700 bg-amber-50 px-2 py-1 rounded">{roleLabel[p.role] || p.role}</span></td>
                        <td className="px-5 py-3.5 text-xs text-stone-400">Invited {new Date(p.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</td>
                        <td className="px-3 py-3.5 text-right">
                          <button onClick={() => cancelInvite(p.email)}
                            className="text-xs font-semibold text-stone-400 hover:text-red-600 transition-colors">Cancel</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </AppShell>
      );
    }

    // ============================================================
    // APP v2 (root — handles auth + routing + roles)
    // ============================================================
    // ============================================================
    // SHARED 5-STEP WISHLIST WIZARD  (self-contained IIFE)
    // Exposes one symbol: WishlistWizard. Drop into any page that has
    // React + framer-motion + the lucide icons imported.
    // Props:
    //   onComplete(data)      required — called on "Save & generate plan"
    //   onSaveDraft(data)     optional — shows a "Save draft" button if set
    //   initialData           optional — prefill (edit / internal mode)
    //   internal              optional bool — shows an "internal" hint
    // ============================================================
    const WishlistWizard = (function () {
      const { useState } = React;

      const DEPARTMENTS = ['Marketing', 'Sales', 'RevOps', 'Customer Success', 'Founder / Exec', 'Operations', 'Other'];
      const BUSINESS_STAGES = ['Pre-revenue / Seed', 'Early (<$1M ARR)', 'Growth ($1M – $10M ARR)', 'Growth ($10M – $50M ARR)', 'Scale ($50M+ ARR)'];
      const TIMEZONES = [
        '(GMT-8) Pacific Time (US & Canada)', '(GMT-7) Mountain Time (US & Canada)',
        '(GMT-6) Central Time (US & Canada)', '(GMT-5) Eastern Time (US & Canada)',
        '(GMT+0) UTC / London', '(GMT+1) Central European Time',
        '(GMT+5:30) India Standard Time', '(GMT+6) Bangladesh', '(GMT+8) Singapore / China'
      ];
      const BUSINESS_PRIORITIES = [
        'Generate more leads', 'Book more meetings', 'Improve conversion rates',
        'Launch a new campaign', 'Improve marketing operations', 'Improve reporting visibility',
        'Build brand awareness', 'Improve customer retention', 'Other'
      ];
      const MAX_PRIORITIES = 3;
      const SUCCESS_METRIC_OPTIONS = [
        'Meetings', 'Leads', 'Opportunities', 'Revenue', 'Pipeline',

      const PRIORITY_LEVELS = ['High', 'Medium', 'Low'];
      const TARGET_START_OPTIONS = ['ASAP (within 1 week)', 'Within 2 weeks', 'Within 1 month', 'This quarter', 'Specific date'];
      const TARGET_COMPLETION_OPTIONS = ['Within 2 weeks', 'Within 1 month', 'Within this quarter', 'Specific date', 'No hard deadline'];

      const STEPS = [
        { n: 1, label: 'Customer Details' },
        { n: 2, label: 'Your Goals' },
        { n: 3, label: 'Measure Success' },
        { n: 4, label: 'Wishlist Projects' },
        { n: 5, label: 'Review & Submit' },
      ];

      const newProject = () => ({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Math.random()),
        name: '', description: '', desiredOutcome: '',
        priority: 'Medium',
        targetStart: '', targetStartDate: '',
        targetCompletion: '', targetCompletionDate: '',
        notes: '',
        area: '', product: '', package: '', capability: '', teamNote: ''
      });

      const defaultBaseline = () => [
        { label: 'Monthly MQLs', current: '', target: '' },
        { label: 'Monthly SQLs', current: '', target: '' },
        { label: 'Meetings per month', current: '', target: '' },
        { label: 'Pipeline generated / month', current: '', target: '' },
        { label: 'SQL Conversion Rate', current: '', target: '' },
      ];

      const blankData = () => ({
        companyName: '', companyUrl: '', contactName: '', email: '',
        primaryStakeholder: '', department: '', businessStage: '', timezone: '',
        topPriorities: [], priorityOther: '', highestPriority: '', whyImportant: '',
        successDefinition: '', successMetrics: [], metricOther: '', successNotes: '', baseline: defaultBaseline(),
        projects: [newProject()],
      });

      const Lbl = ({ children, hint, required }) => (
        <label className="block mb-1.5">
          <span className="text-[11px] font-bold uppercase tracking-wider text-stone-500">{children}{required && <span className="text-emerald-600"> *</span>}</span>
          {hint && <span className="block text-xs text-stone-400 font-normal normal-case tracking-normal mt-0.5">{hint}</span>}
        </label>
      );
      const Inp = ({ icon: Icon, ...p }) => (
        <div className="relative">
          {Icon && <Icon className="w-4 h-4 text-stone-400 absolute left-3 top-1/2 -translate-y-1/2" />}
          <input {...p} className={`w-full ${Icon ? 'pl-9' : 'pl-3'} pr-3 py-2.5 border border-stone-200 rounded-lg text-sm text-stone-900 placeholder-stone-300 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10 transition-all bg-white`} />
        </div>
      );
      const Txt = (p) => (
        <textarea {...p} className="w-full px-3 py-2.5 border border-stone-200 rounded-lg text-sm text-stone-900 placeholder-stone-300 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10 transition-all bg-white resize-none" />
      );
      const Sel = ({ value, onChange, options, placeholder, disabled }) => (
        <div className="relative">
          <select value={value} onChange={onChange} disabled={disabled}
            className="w-full appearance-none px-3 py-2.5 pr-9 border border-stone-200 rounded-lg text-sm text-stone-900 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10 transition-all bg-white disabled:bg-stone-50 disabled:text-stone-400">
            <option value="">{placeholder}</option>
            {options.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
          <ChevronDown className="w-4 h-4 text-stone-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none" />
        </div>
      );
      const Chk = ({ label, checked, onToggle, disabled }) => (
        <button type="button" onClick={onToggle} disabled={disabled && !checked}
          className={`flex items-center gap-2.5 px-1 py-1.5 text-sm text-left transition-colors w-full
            ${disabled && !checked ? 'text-stone-300 cursor-not-allowed' : 'text-stone-700 hover:text-stone-900'}`}>
          <span className={`w-4 h-4 rounded flex items-center justify-center flex-shrink-0 border transition-colors
            ${checked ? 'bg-emerald-600 border-emerald-600' : 'border-stone-300 bg-white'}`}>
            {checked && <Check className="w-3 h-3 text-white" />}
          </span>
          {label}
        </button>
      );

      function StepDetails({ d, set }) {
        return (
          <div className="space-y-5">
            <div className="grid sm:grid-cols-2 gap-5">
              <div><Lbl required>Company Name</Lbl><Inp icon={Building2} value={d.companyName} onChange={e => set('companyName', e.target.value)} placeholder="Acme Inc." /></div>
              <div><Lbl>Company Website</Lbl><Inp icon={Link2} value={d.companyUrl} onChange={e => set('companyUrl', e.target.value)} placeholder="acme.com" /></div>
            </div>
            <div className="grid sm:grid-cols-2 gap-5">
              <div><Lbl required>Your Name</Lbl><Inp icon={User} value={d.contactName} onChange={e => set('contactName', e.target.value)} placeholder="Jane Smith" /></div>
              <div><Lbl required>Email Address</Lbl><Inp icon={Mail} type="email" value={d.email} onChange={e => set('email', e.target.value)} placeholder="jane@acme.com" /></div>
            </div>
            <div className="grid sm:grid-cols-2 gap-5">
              <div><Lbl required>Primary Stakeholder</Lbl><Inp icon={User} value={d.primaryStakeholder} onChange={e => set('primaryStakeholder', e.target.value)} placeholder="Jane Smith – Marketing Director" /></div>
              <div><Lbl required>Department</Lbl><Sel value={d.department} onChange={e => set('department', e.target.value)} options={DEPARTMENTS} placeholder="Select department…" /></div>
            </div>
            <div className="grid sm:grid-cols-2 gap-5">
              <div><Lbl required>Business Stage</Lbl><Sel value={d.businessStage} onChange={e => set('businessStage', e.target.value)} options={BUSINESS_STAGES} placeholder="Select stage…" /></div>
              <div><Lbl>Timezone</Lbl><Sel value={d.timezone} onChange={e => set('timezone', e.target.value)} options={TIMEZONES} placeholder="Select timezone…" /></div>
            </div>
          </div>
        );
      }

      function StepGoals({ d, set }) {
        const atLimit = d.topPriorities.length >= MAX_PRIORITIES;
        const toggle = (g) => {
          let topPriorities;
          if (d.topPriorities.includes(g)) topPriorities = d.topPriorities.filter(x => x !== g);
          else if (atLimit) return;
          else topPriorities = [...d.topPriorities, g];
          let highestPriority = d.highestPriority;
          if (!topPriorities.includes(highestPriority)) highestPriority = topPriorities[0] || '';
          set('_bulk', { topPriorities, highestPriority });
        };
        return (
          <div className="grid lg:grid-cols-2 gap-x-8 gap-y-6">
            <div>
              <Lbl hint={`In plain language — what are you hoping to achieve over the next 90 days? Select up to ${MAX_PRIORITIES} · ${d.topPriorities.length}/${MAX_PRIORITIES}`}>What are your goals?</Lbl>
              <div className="grid grid-cols-1 gap-0.5">
                {BUSINESS_PRIORITIES.map(g => <Chk key={g} label={g} checked={d.topPriorities.includes(g)} onToggle={() => toggle(g)} disabled={atLimit} />)}
              </div>
              {d.topPriorities.includes('Other') && (
                <div className="mt-2"><Inp value={d.priorityOther} onChange={e => set('priorityOther', e.target.value)} placeholder="Please specify" /></div>
              )}
            </div>
            <div className="space-y-5">
              <div>
                <Lbl required>Which goal is most important?</Lbl>
                <Sel value={d.highestPriority} onChange={e => set('highestPriority', e.target.value)} options={d.topPriorities} placeholder="Select your #1 goal…" disabled={d.topPriorities.length === 0} />
              </div>
              <div>
                <Lbl hint="This becomes the foundation for future business planning.">Why is this important right now?</Lbl>
                <Txt rows={5} value={d.whyImportant} onChange={e => set('whyImportant', e.target.value)} placeholder="e.g. We need a predictable pipeline to support our growth targets and prepare for our upcoming fundraising round." />
              </div>
            </div>
          </div>
        );
      }

      function StepSuccess({ d, set }) {
        const toggle = (m) => set('successMetrics', d.successMetrics.includes(m) ? d.successMetrics.filter(x => x !== m) : [...d.successMetrics, m]);
        const setRow = (i, field, v) => set('baseline', d.baseline.map((r, idx) => idx === i ? { ...r, [field]: v } : r));
        return (
          <div className="space-y-6">
            <div className="grid lg:grid-cols-2 gap-x-8 gap-y-6">
              <div className="space-y-5">
                <div>
                  <Lbl required hint="Examples: 20 qualified meetings · CRM cleaned up · dashboard live · better lead quality.">How would you know this partnership is successful in 90 days?</Lbl>
                  <Txt rows={5} value={d.successDefinition} onChange={e => set('successDefinition', e.target.value)} placeholder="Describe a clear, repeatable win." />
                </div>
                <div>
                  <Lbl hint="Optional">Anything else about how success is measured internally?</Lbl>
                  <Txt rows={3} value={d.successNotes} onChange={e => set('successNotes', e.target.value)} placeholder="Internal targets, board metrics, how this gets reported up." />
                </div>
              </div>
              <div>
                <Lbl hint="Select all that apply">What metrics matter most to you?</Lbl>
                <div className="grid grid-cols-2 gap-0.5">
                  {SUCCESS_METRIC_OPTIONS.map(m => <Chk key={m} label={m} checked={d.successMetrics.includes(m)} onToggle={() => toggle(m)} />)}
                </div>
                {d.successMetrics.includes('Other') && (
                  <div className="mt-2"><Inp value={d.metricOther} onChange={e => set('metricOther', e.target.value)} placeholder="Please specify" /></div>
                )}
              </div>
            </div>
            <div>
              <Lbl hint="Optional — anchors success in real numbers.">Current baseline → desired outcome (90 days)</Lbl>
              <div className="overflow-x-auto border border-stone-200 rounded-xl">
                <table className="w-full text-sm">
                  <thead className="bg-stone-50 text-[11px] uppercase tracking-wider text-stone-500">
                    <tr>
                      <th className="text-left font-semibold px-4 py-2.5">Metric</th>
                      <th className="text-left font-semibold px-4 py-2.5">Where are you today?</th>
                      <th className="text-left font-semibold px-4 py-2.5 bg-emerald-50/60 text-emerald-700">Where would you like to be?</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-stone-100">
                    {d.baseline.map((r, i) => (
                      <tr key={r.label}>
                        <td className="px-4 py-2 text-stone-600 font-medium">{r.label}</td>
                        <td className="px-3 py-2"><input value={r.current} onChange={e => setRow(i, 'current', e.target.value)} placeholder="—" className="w-full px-2.5 py-1.5 border border-stone-200 rounded-md text-sm focus:outline-none focus:border-emerald-500" /></td>
                        <td className="px-3 py-2 bg-emerald-50/30"><input value={r.target} onChange={e => setRow(i, 'target', e.target.value)} placeholder="—" className="w-full px-2.5 py-1.5 border border-stone-200 rounded-md text-sm focus:outline-none focus:border-emerald-500" /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      }

      function ProjectCard({ p, idx, onChange, onDelete, canDelete }) {
        const u = (f, v) => onChange({ ...p, [f]: v });
        return (
          <div className="bg-white rounded-xl border border-stone-200 p-5 space-y-4">
            <div className="flex items-center justify-between">
              <span className="text-[11px] font-bold uppercase tracking-wider text-stone-400">Project {idx + 1}</span>
              {canDelete && <button onClick={onDelete} className="p-1.5 text-stone-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"><Trash2 className="w-4 h-4" /></button>}
            </div>
            <div><Lbl>Project name</Lbl><Inp value={p.name} onChange={e => u('name', e.target.value)} placeholder="e.g. Outbound LinkedIn program" /></div>
            <div className="grid sm:grid-cols-2 gap-4">
              <div><Lbl>Brief description</Lbl><Txt rows={3} value={p.description} onChange={e => u('description', e.target.value)} placeholder="What you'd like to do." /></div>
              <div><Lbl hint="The result, not the task.">Desired outcome</Lbl><Txt rows={3} value={p.desiredOutcome} onChange={e => u('desiredOutcome', e.target.value)} placeholder="e.g. Increase executive visibility with prospects." /></div>
            </div>
            <div className="grid sm:grid-cols-3 gap-4">
              <div>
                <Lbl>Priority</Lbl>
                <div className="flex gap-1.5">
                  {PRIORITY_LEVELS.map(lvl => (
                    <button key={lvl} type="button" onClick={() => u('priority', lvl)}
                      className={`flex-1 py-2 rounded-md text-xs font-semibold border transition-all ${p.priority === lvl ? 'border-emerald-600 bg-emerald-600 text-white' : 'border-stone-200 bg-white text-stone-600 hover:border-stone-400'}`}>{lvl}</button>
                  ))}
                </div>
              </div>
              <div>
                <Lbl>Target start</Lbl>
                <Sel value={p.targetStart} onChange={e => u('targetStart', e.target.value)} options={TARGET_START_OPTIONS} placeholder="When…" />
                {p.targetStart === 'Specific date' && <input type="date" value={p.targetStartDate} onChange={e => u('targetStartDate', e.target.value)} className="mt-2 w-full px-3 py-2 border border-stone-200 rounded-lg text-sm" />}
              </div>
              <div>
                <Lbl>Target completion</Lbl>
                <Sel value={p.targetCompletion} onChange={e => u('targetCompletion', e.target.value)} options={TARGET_COMPLETION_OPTIONS} placeholder="By…" />
                {p.targetCompletion === 'Specific date' && <input type="date" value={p.targetCompletionDate} onChange={e => u('targetCompletionDate', e.target.value)} className="mt-2 w-full px-3 py-2 border border-stone-200 rounded-lg text-sm" />}
              </div>
            </div>
            <div><Lbl hint="Optional">References / notes</Lbl><Txt rows={2} value={p.notes} onChange={e => u('notes', e.target.value)} placeholder="Links, examples, or context." /></div>
          </div>
        );
      }

      function StepProjects({ d, set }) {
        const upd = (id, np) => set('projects', d.projects.map(p => p.id === id ? np : p));
        const del = (id) => set('projects', d.projects.filter(p => p.id !== id));
        const add = () => set('projects', [...d.projects, newProject()]);
        return (
          <div className="space-y-4">
            <p className="text-sm text-stone-500">The specific projects you'd like help with. We'll map each to the right capability.</p>
            {d.projects.map((p, i) => <ProjectCard key={p.id} p={p} idx={i} onChange={(np) => upd(p.id, np)} onDelete={() => del(p.id)} canDelete={d.projects.length > 1} />)}
            <button onClick={add} className="w-full py-3 border-2 border-dashed border-stone-200 rounded-xl text-sm font-semibold text-stone-500 hover:border-emerald-400 hover:text-emerald-700 transition-colors flex items-center justify-center gap-2"><Plus className="w-4 h-4" /> Add another project</button>
          </div>
        );
      }

      function StepReview({ d }) {
        const Row = ({ k, v }) => (v ? <div className="flex gap-3 py-1 text-sm"><span className="text-stone-400 w-44 flex-shrink-0">{k}</span><span className="text-stone-800">{v}</span></div> : null);
        const list = (a) => (a || []).filter(Boolean).join(', ');
        return (
          <div className="space-y-6">
            <p className="text-sm text-stone-500">Review everything below, then submit. Our team will map each project to the right capability and follow up.</p>
            <div className="rounded-xl border border-stone-200 divide-y divide-stone-100">
              <div className="p-5">
                <p className="text-xs font-bold uppercase tracking-wider text-stone-400 mb-2">Customer</p>
                <Row k="Company" v={d.companyName} /><Row k="Website" v={d.companyUrl} /><Row k="Contact" v={d.contactName} /><Row k="Email" v={d.email} />
                <Row k="Stakeholder" v={d.primaryStakeholder} /><Row k="Department" v={d.department} /><Row k="Business stage" v={d.businessStage} /><Row k="Timezone" v={d.timezone} />
              </div>
              <div className="p-5">
                <p className="text-xs font-bold uppercase tracking-wider text-stone-400 mb-2">Goals & success</p>
                <Row k="Goals" v={list(d.topPriorities)} /><Row k="Most important" v={d.highestPriority} /><Row k="Why now" v={d.whyImportant} />
                <Row k="Definition of success" v={d.successDefinition} /><Row k="Metrics" v={list(d.successMetrics)} /><Row k="Internal notes" v={d.successNotes} />
              </div>
              <div className="p-5">
                <p className="text-xs font-bold uppercase tracking-wider text-stone-400 mb-2">Projects ({d.projects.filter(p => p.name).length})</p>
                {d.projects.filter(p => p.name).map(p => <Row key={p.id} k={p.name} v={p.desiredOutcome || p.description || '—'} />)}
              </div>
            </div>
          </div>
        );
      }

      function PreviewPlan({ d }) {
        const targetLines = d.baseline.filter(b => b.target).map(b => `${b.label}: ${b.target}`);
        const metrics = targetLines.length ? targetLines : (d.successMetrics || []).filter(x => x !== 'Other');
        return (
          <div className="space-y-5">
            <div className="rounded-xl border border-emerald-200 bg-emerald-50/50 p-4">
              <div className="flex items-center gap-2 mb-1"><Target className="w-4 h-4 text-emerald-600" /><p className="text-[11px] font-bold uppercase tracking-wider text-emerald-700">Primary goal</p></div>
              <p className="text-sm font-semibold text-stone-800">{d.highestPriority || d.topPriorities[0] || 'Not set yet'}</p>
            </div>
            <div>
              <div className="flex items-center gap-1.5 mb-1.5"><TrendingUp className="w-3.5 h-3.5 text-emerald-600" /><p className="text-[11px] font-bold uppercase tracking-wider text-stone-500">Success metrics</p></div>
              {metrics.length ? <ul className="space-y-1">{metrics.slice(0, 5).map((t, i) => <li key={i} className="text-xs text-stone-600 flex gap-1.5"><span className="text-emerald-500 mt-0.5">•</span>{t}</li>)}</ul>
                : <p className="text-xs text-stone-300 italic">—</p>}
            </div>
            {d.successDefinition && (
              <div>
                <p className="text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">What success looks like</p>
                <p className="text-xs text-stone-600 leading-relaxed">{d.successDefinition.slice(0, 180)}{d.successDefinition.length > 180 ? '…' : ''}</p>
              </div>
            )}
          </div>
        );
      }

      function Stepper({ step, maxVisited, go }) {
        return (
          <div className="mb-8">
            <div className="flex items-center">
              {STEPS.map((s, i) => {
                const done = s.n < step, active = s.n === step, reachable = s.n <= maxVisited;
                return (
                  <React.Fragment key={s.n}>
                    <button type="button" onClick={() => reachable && go(s.n)} disabled={!reachable}
                      className="flex flex-col items-center gap-1.5 group flex-shrink-0">
                      <span className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all
                        ${done ? 'bg-emerald-600 text-white' : active ? 'bg-emerald-600 text-white ring-4 ring-emerald-600/15' : reachable ? 'bg-white border-2 border-stone-300 text-stone-400 group-hover:border-emerald-400' : 'bg-white border-2 border-stone-200 text-stone-300'}`}>
                        {done ? <Check className="w-4 h-4" /> : s.n}
                      </span>
                      <span className={`text-[10px] font-semibold text-center w-20 leading-tight hidden md:block ${active ? 'text-emerald-700' : 'text-stone-400'}`}>{s.label}</span>
                    </button>
                    {i < STEPS.length - 1 && <div className={`flex-1 h-0.5 mx-1 -mt-4 md:mt-0 md:mb-5 rounded ${s.n < step ? 'bg-emerald-500' : 'bg-stone-200'}`} />}
                  </React.Fragment>
                );
              })}
            </div>
            <p className="md:hidden text-center text-xs font-semibold text-emerald-700 mt-2">Step {step} of {STEPS.length} · {STEPS[step - 1].label}</p>
          </div>
        );
      }

      const SECTION_TITLES = {
        1: ['Customer Details', "Let's start with some basics."],
        2: ['What Are Your Goals?', 'In plain language — what are you hoping to achieve over the next 90 days?'],
        3: ['How Would You Measure Success?', "We capture outcomes, not just projects."],
        4: ['Wishlist Projects', 'The specific work you want help with.'],
        5: ['Review & Submit', 'Confirm the details and send it to the team.'],
      };

      function Wizard({ onComplete, onSaveDraft, initialData, internal }) {
        const [d, setD] = useState(() => {
          if (initialData) return { ...blankData(), ...initialData };
          if (!internal) { try { const sv = localStorage.getItem('gl_wishlist_draft'); if (sv) return { ...blankData(), ...JSON.parse(sv) }; } catch (e) {} }
          return blankData();
        });
        const [step, setStep] = useState(1);
        const [maxVisited, setMaxVisited] = useState(1);
        const [saving, setSaving] = useState(false);
        const [error, setError] = useState('');
        const [note, setNote] = useState('');

        const set = (field, value) => {
          if (field === '_bulk') setD(s => ({ ...s, ...value }));
          else setD(s => ({ ...s, [field]: value }));
        };

        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email);
        const valid = (st) => {
          if (st === 1) return d.companyName.trim() && d.contactName.trim() && emailOk && d.primaryStakeholder.trim() && d.department && d.businessStage;
          if (st === 2) return d.topPriorities.length > 0 && d.highestPriority;
          if (st === 3) return d.successDefinition.trim() && d.successMetrics.length > 0;
          if (st === 4) return d.projects.some(p => p.name.trim());
          return true;
        };
        const stepHint = (st) => {
          if (st === 1) return 'Company, your name, email, stakeholder, department and business stage are required.';
          if (st === 2) return 'Pick at least one goal and set your most important one.';
          if (st === 3) return 'Describe success and choose at least one metric.';
          if (st === 4) return 'Add at least one named project.';
          return '';
        };

        const goTo = (n) => { setStep(n); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        const next = () => { if (valid(step)) { const n = Math.min(STEPS.length, step + 1); setStep(n); setMaxVisited(m => Math.max(m, n)); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
        const prev = () => goTo(Math.max(1, step - 1));

        const firstInvalid = () => { for (const s of STEPS) if (!valid(s.n)) return s.n; return 0; };
        const submit = async () => {
          const bad = firstInvalid();
          if (bad) { setStep(bad); setMaxVisited(m => Math.max(m, bad)); setError('Please complete the required fields in this step before submitting.'); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
          setError(''); setSaving(true);
          try {
            await onComplete({ ...d, submittedAt: new Date().toISOString() });
            try { localStorage.removeItem('gl_wishlist_draft'); } catch (e) {}
          } catch (e) {
            setError("Couldn't save — please try again.");
          }
          setSaving(false);
        };

        const showRail = !internal;
        const saveDraft = () => {
          if (onSaveDraft) { onSaveDraft(d); setNote('Draft saved.'); setTimeout(() => setNote(''), 2500); return; }
          try { localStorage.setItem('gl_wishlist_draft', JSON.stringify(d)); setNote('Draft saved on this device.'); } catch (e) { setNote('Could not save draft.'); }
          setTimeout(() => setNote(''), 2500);
        };

        return (

    function ClientInviteView({ user, userRole, onBack, onLogout }) {
      const [company, setCompany] = React.useState('');
      const [emails, setEmails] = React.useState('');
      const [phrase, setPhrase] = React.useState(CLIENT_PAGE_PASSWORD);
      const [note, setNote] = React.useState('');
      const [sending, setSending] = React.useState(false);
      const [msg, setMsg] = React.useState('');
      const [err, setErr] = React.useState('');

      const parseEmails = (s) => Array.from(new Set(s.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean)));

      const send = async () => {
        setErr(''); setMsg('');
        const list = parseEmails(emails);
        if (list.length === 0) { setErr('Add at least one client email.'); return; }
        const bad = list.filter(e => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e));
        if (bad.length) { setErr('Please check these addresses: ' + bad.join(', ')); return; }
        setSending(true);
        try {
          const rows = list.map(e => ({ company: company.trim() || null, client_email: e, access_phrase: phrase, note: note.trim() || null, invited_by: user.id }));
          const { error } = await supabase.from('client_invites').insert(rows);
          if (error) throw error;
          setMsg(`Invite${list.length > 1 ? 's' : ''} sent to ${list.length} client${list.length > 1 ? 's' : ''}.`);
          setCompany(''); setEmails(''); setNote('');
        } catch (e) {
          setErr(e.message || 'Could not send — please try again.');
        }
        setSending(false);
      };

      return (
        <AppShell user={user} userRole={userRole} onLogout={onLogout}
          onNewWishlist={onBack} onAllWishlists={onBack} onUserMgmt={onBack} onProfile={onBack} onInviteClient={() => {}} onSuperAdmin={onBack}>
          <div className="max-w-xl mx-auto px-6 py-10">
            <h1 className="text-2xl font-bold text-stone-900 mb-1">Send Client Invite</h1>
            <p className="text-sm text-stone-500 mb-6">Email a client the wishlist link and access phrase so they can fill it out.</p>

            <div className="bg-white rounded-2xl border border-stone-200 shadow-sm p-6 space-y-5">
              <div>
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Company</label>
                <input value={company} onChange={e => setCompany(e.target.value)} placeholder="Acme Inc."
                  className="w-full px-3 py-2.5 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10" />
              </div>
              <div>
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Client email(s) <span className="text-emerald-600">*</span></label>
                <textarea value={emails} onChange={e => setEmails(e.target.value)} rows={2} placeholder="jane@acme.com, john@acme.com"
                  className="w-full px-3 py-2.5 border border-stone-200 rounded-lg text-sm resize-none focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10" />
                <p className="text-xs text-stone-400 mt-1">Separate multiple addresses with commas — each gets its own email.</p>
              </div>
              <div>
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Access phrase to send</label>
                <input value={phrase} onChange={e => setPhrase(e.target.value)}
                  className="w-full px-3 py-2.5 border border-stone-200 rounded-lg text-sm font-mono focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10" />
                <p className="text-xs text-stone-400 mt-1">Must match the phrase on the form, or the client can't get in.</p>
              </div>
              <div>
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Note (optional)</label>
                <textarea value={note} onChange={e => setNote(e.target.value)} rows={2} placeholder="A short personal note to include in the email."
                  className="w-full px-3 py-2.5 border border-stone-200 rounded-lg text-sm resize-none focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/10" />
              </div>

              {err && <div className="px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">{err}</div>}
              {msg && <div className="px-4 py-3 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-700">{msg}</div>}

              <div className="flex justify-end gap-2 pt-1">
                <button onClick={onBack} className="px-4 py-2 rounded-lg text-sm font-semibold text-stone-600 border border-stone-200 hover:bg-stone-50 transition-colors">Back</button>
                <button onClick={send} disabled={sending}
                  className="px-5 py-2 rounded-lg text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 transition-colors disabled:opacity-50 inline-flex items-center gap-2">
                  {sending ? 'Sending…' : <><Send className="w-4 h-4" /> Send invite</>}
                </button>
              </div>
            </div>
          </div>
        </AppShell>
      );
    }

    function App() {
      const [appView, setAppView] = React.useState('loading'); // loading | login | main | wishlists | profile | usermgmt
      const [user, setUser] = React.useState(null);
      const [userRole, setUserRole] = React.useState(null);
      const [userProfile, setUserProfile] = React.useState(null);
      const [pageView, setPageView] = React.useState('form'); // form | admin
      const [formData, setFormData] = React.useState({
        companyName: '', companyUrl: '', contactName: '', contactRole: '', email: '', industry: '',
        goals: [], primaryGoal: '', goalReason: '',
        successDefinition: '', successMetrics: [], successNotes: '',
        projects: [newProject()]
      });
      const [adminData, setAdminData] = React.useState(null);
      const [wizardInitial, setWizardInitial] = React.useState(null);
      const [editingId, setEditingId] = React.useState(null);
      const [wizardKey, setWizardKey] = React.useState(0);

      const fetchProfile = async (userId) => {
        const { data } = await supabase.from('profiles').select('*').eq('id', userId).single();
        if (data) {
          setUserRole(data.role);
          setUserProfile(data);
          // PM and CSM land on wishlists, others on form
          if (data.role === 'project_manager' || data.role === 'csm') {
            setAppView('wishlists');
          } else {
            setAppView('main');
          }
        } else {
          // No profile row = not a provisioned member, or access was revoked. Deny access.
          await supabase.auth.signOut();
          setUser(null); setUserRole(null);
          setAppView('login');
        }
      };

      React.useEffect(() => {
        // Check if this is a password reset redirect
        const hash = window.location.hash;
        const params = new URLSearchParams(window.location.search);
        if (hash.includes('type=recovery') || params.get('reset') === 'true') {
          setAppView('reset_password');
          return;
        }

        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) { setUser(session.user); fetchProfile(session.user.id); }
          else setAppView('login');
        });
        supabase.auth.onAuthStateChange((_event, session) => {
          if (_event === 'PASSWORD_RECOVERY') {
            setAppView('reset_password');
            return;
          }
          if (session) { setUser(session.user); fetchProfile(session.user.id); }
          else { setUser(null); setUserRole(null); setAppView('login'); }
        });
      }, []);

      const handleLogin = (u) => { setUser(u); fetchProfile(u.id); };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setUser(null); setUserRole(null); setUserProfile(null);
        setAppView('login');
      };

      const handleNewWishlist = () => {
        if (userRole === 'project_manager' || userRole === 'csm') return;
        setWizardInitial(null);
        setEditingId(null);
        setWizardKey(k => k + 1);
        setAdminData(null);
        setPageView('form');
        setAppView('main');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSelectWishlist = (w) => {
        const sub = {
          id: w.id,
          companyName: w.company_name,
          companyUrl: w.company_url || '',
          contactName: w.contact_name || '',
          email: w.contact_email || '',
          primaryStakeholder: w.primary_stakeholder || '',
          department: w.department || '',
          businessStage: w.business_stage || '',
          timezone: w.timezone || '',
          goals: Array.isArray(w.goals) ? w.goals : [],
          priorityOther: w.priority_other || '',
          primaryGoal: w.primary_goal || '',
          goalReason: w.goal_reason || '',
          successDefinition: w.success_definition || '',
          successMetrics: Array.isArray(w.success_metrics) ? w.success_metrics : [],
          metricOther: w.metric_other || '',
          successNotes: w.success_notes || '',
          baseline: Array.isArray(w.success_baseline) ? w.success_baseline : [],
          shareToken: w.share_token || null,
          submittedAt: w.submitted_at || w.created_at,
          projects: Array.isArray(w.projects) ? w.projects : []
        };
        setAdminData(sub);
        setEditingId(w.id);
        setPageView('admin');
        setAppView('main');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleWizardComplete = async (data) => {
        if (editingId) {
          // Editing an existing wishlist → update in place (no duplicate).
          const row = toRow(data);
          delete row.submitted_at; // preserve the original submission time
          const { error } = await supabase.from('wishlists').update(row).eq('id', editingId);
          if (error) throw error;
          setAdminData({ ...wizardToSubmission(data, editingId), shareToken: (adminData && adminData.shareToken) || null });
        } else {
          // Brand-new wishlist → insert, then remember its id so a later
          // save updates this same row instead of creating another.
          const { data: inserted, error } = await supabase.from('wishlists').insert([toRow(data)]).select().single();
          if (error) throw error;
          setEditingId(inserted ? inserted.id : null);
          setAdminData({ ...wizardToSubmission(data, inserted ? inserted.id : undefined), shareToken: inserted ? inserted.share_token : null });
        }
        setPageView('admin');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleEditForm = () => {
        if (adminData) {
          setWizardInitial(submissionToWizard(adminData));
          setEditingId(adminData.id || null);
          setWizardKey(k => k + 1);
        }
        setPageView('form');
      };

          company_name: sub.companyName,
          company_url: sub.companyUrl,
          contact_name: sub.contactName,
          contact_role: sub.contactRole,
          contact_email: sub.email,
          industry: sub.industry,
          goals: sub.goals,
          primary_goal: sub.primaryGoal,
          goal_reason: sub.goalReason,
          success_definition: sub.successDefinition,
          success_metrics: sub.successMetrics,
          success_notes: sub.successNotes,
          projects: sub.projects,
          submitted_at: sub.submittedAt
        }]).select().single();
        if (!error && data) sub.id = data.id;
        setAdminData(sub);
        setPageView('admin');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleUpdateWishlist = async (updated) => {
        setAdminData(updated);

          await supabase.from('wishlists').update({
            company_name: updated.companyName,
            company_url: updated.companyUrl,
            contact_name: updated.contactName,
            contact_email: updated.email,
            primary_stakeholder: updated.primaryStakeholder,
            department: updated.department,
            business_stage: updated.businessStage,

            goals: updated.goals,
            priority_other: updated.priorityOther,
            primary_goal: updated.primaryGoal,
            goal_reason: updated.goalReason,
            success_definition: updated.successDefinition,
            success_metrics: updated.successMetrics,
            metric_other: updated.metricOther,
            success_notes: updated.successNotes,
            success_baseline: updated.baseline,
